{% extends "base.html" %}
{% block title %}Setup – Tennis Tracker{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card form-card p-4">
      <div class="text-center mb-4">
        <i class="bi bi-person-circle" style="font-size:3rem; color:var(--court-green)"></i>
        <h3 class="mt-2 fw-bold">Welcome to Tennis Tracker</h3>
        <p class="text-muted">Let's set up your son's profile to get started.</p>
      </div>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label fw-semibold">Player Name</label>
          <input type="text" name="name" class="form-control" placeholder="e.g. Alex" required />
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Date of Birth <span class="text-muted fw-normal">(optional)</span></label>
          <input type="date" name="dob" class="form-control" />
        </div>
        <button type="submit" class="btn btn-success w-100 fw-bold">
          <i class="bi bi-check-circle me-1"></i> Create Profile
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
