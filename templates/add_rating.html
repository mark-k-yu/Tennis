{% extends "base.html" %}
{% block title %}Add Rating – Tennis Tracker{% endblock %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card form-card p-4">
      <h4 class="fw-bold mb-4">
        <i class="bi bi-star me-2 text-warning"></i> Log Rating Update
      </h4>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label fw-semibold">Date</label>
          <input type="date" name="date" class="form-control" required />
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">UTR Rating</label>
          <input type="number" name="utr" step="0.01" min="1" max="16.5" class="form-control"
                 placeholder="e.g. 8.50" />
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">USTA Rating</label>
          <input type="text" name="usta_rating" class="form-control"
                 placeholder="e.g. 10U, 12U, 14U, 3.0, 4.0" />
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">USTA Ranking</label>
          <input type="number" name="usta_ranking" min="1" class="form-control"
                 placeholder="National/Sectional ranking number" />
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Notes</label>
          <textarea name="notes" class="form-control" rows="2"></textarea>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-success fw-semibold">
            <i class="bi bi-check-circle me-1"></i> Save Rating
          </button>
          <a href="{{ url_for('stats') }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
